Section "InputClass"
        Identifier "system-keyboard"
        MatchIsKeyboard "on"
        Option "XkbLayout" "ch"
        Option "XkbModel" "pc105"
        Option "XkbVariant" "de_nodeadkeys"
        Option "XkbOptions" "grp:alt_space_toggle"
EndSection
